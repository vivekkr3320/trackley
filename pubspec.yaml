name: trackley
description: Trackley is a privacy-first manual trip-distance tracker for Android and iOS.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  fl_chart: ^0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

